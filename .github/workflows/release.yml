name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: git diff --exit-code -- magical-family-clock.js
      - name: Check tag matches package
        run: node -e 'if (process.env.GITHUB_REF_NAME !== "v" + JSON.parse(require("fs").readFileSync("package.json")).version) process.exit(1)'
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser -- --reporter=line,github
      - name: Publish bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then release_flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" magical-family-clock.js --verify-tag --notes-file docs/RELEASE-NOTES.md --title "Magical Family Clock $GITHUB_REF_NAME" "${release_flags[@]}"
